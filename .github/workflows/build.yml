name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: apk add --no-cache cmake make || true

      - name: Compilar
        run: |
          cmake -S . -B build
          cmake --build build

      - uses: actions/upload-artifact@v4
        with:
          name: ComboPeel
          path: build/combo_peel.skprx
