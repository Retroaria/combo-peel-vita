name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - uses: actions/checkout@v5

      - name: Instalar ferramentas
        run: apk add --no-cache cmake make || true

      - name: Compilar
        run: |
          cmake -S . -B build
          cmake --build build

      - uses: actions/upload-artifact@v5
        with:
          name: ComboPeel
          path: |
            build/ComboPeel.vpk
            build/combo_peel.skprx

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ComboPeel ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: |
            build/ComboPeel.vpk
            build/combo_peel.skprx
